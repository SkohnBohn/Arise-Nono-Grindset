name: AriseNono
options:
  bundleIdPrefix: com.ariseapp
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  createIntermediateGroups: true
  defaultConfig: Debug
configs:
  Debug: debug
  Release: release
targets:
  AriseNono:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AriseNono
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ariseapp.arisenono
        SWIFT_VERSION: 5.9
        INFOPLIST_FILE: AriseNono/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
    dependencies: []
  AriseNonoTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AriseNonoTests
    dependencies:
      - target: AriseNono
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ariseapp.arisenono.tests
        SWIFT_VERSION: 5.9
schemes:
  AriseNono:
    build:
      targets:
        AriseNono: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AriseNonoTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
